name: Java CI/CD Pipeline

on:
  push:
    branches:
      - DayWiseProjectFiles
  pull_request:
    branches:
      - DayWiseProjectFiles

jobs:
  build:
    name: 🛠 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🧱 Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: 🏗️ Build with Maven
        run: mvn -B clean compile

      - name: ✅ Run Tests
        run: mvn test

      - name: 📦 Package Application
        run: mvn package -DskipTests

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-build-artifact
          path: target/*.jar

  deploy:
    name: 🚀 Continuous Deployment to DynamoDB
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
  

      - name: 🧱 Ensure DynamoDB Tables Exist
        run: |
          aws dynamodb create-table \
            --table-name Students \
            --attribute-definitions AttributeName=studentId,AttributeType=S \
            --key-schema AttributeName=studentId,KeyType=HASH \
            --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5 || echo "Students table exists"

          aws dynamodb create-table \
            --table-name Courses \
            --attribute-definitions AttributeName=courseId,AttributeType=S \
            --key-schema AttributeName=courseId,KeyType=HASH \
            --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5 || echo "Courses table exists"

          aws dynamodb create-table \
            --table-name Enrollments \
            --attribute-definitions AttributeName=enrollmentId,AttributeType=S \
            --key-schema AttributeName=enrollmentId,KeyType=HASH \
            --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5 || echo "Enrollments table exists"

      - name: 🌱 Seed Sample Data
        run: |
          aws dynamodb put-item --table-name Students \
            --item '{"studentId": {"S": "S001"}, "name": {"S": "Harsha"}, "email": {"S": "harsha@example.com"}}'

          aws dynamodb put-item --table-name Courses \
            --item '{"courseId": {"S": "C001"}, "name": {"S": "DSA"}, "capacity": {"N": "30"}}'
