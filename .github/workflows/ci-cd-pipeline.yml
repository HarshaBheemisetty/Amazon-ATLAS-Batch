name: Java CI/CD Pipeline

on:
  push:
    branches:
      - DayWiseProjectFiles
  pull_request:
    branches:
      - DayWiseProjectFiles

jobs:
  build:
    name: 🛠 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🧱 Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: 🏗️ Build with Maven
        run: mvn -B clean compile

      - name: ✅ Run Tests
        run: mvn test

      - name: 📦 Package Application
        run: mvn package -DskipTests

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-build-artifact
          path: target/*.jar

  deploy:
    name: 🚀 Deploy to Local DynamoDB
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 💾 Download DynamoDB Local
        run: |
          wget https://s3.us-west-2.amazonaws.com/dynamodb-local/dynamodb_local_latest.zip
          unzip dynamodb_local_latest.zip -d dynamodb_local

      - name: 🏃 Start DynamoDB Local
        run: |
          java -Djava.library.path=./dynamodb_local/DynamoDBLocal_lib \
               -jar ./dynamodb_local/DynamoDBLocal.jar -inMemory -sharedDb &
          sleep 5

      - name: 🌱 Set environment variable for local DB
        run: echo "USE_LOCAL_DB=true" >> $GITHUB_ENV

      - name: ☕ Compile Java project
        run: javac -d bin src/PROJECT_SCRS/*.java

      - name: 🏗️ Run DataInsertion class (create tables & seed data)
        run: java -cp bin PROJECT_SCRS.DataInsertion
